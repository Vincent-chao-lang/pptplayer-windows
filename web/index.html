<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PPT Player</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --fg:#e6e8ec; --muted:#8b90a0; --accent:#4f8cff; --line:#2c313c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }

  /* 左侧缩略图 */
  #thumbs { width:172px; flex:0 0 172px; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding:10px; display:none; }
  #thumbs.show { display:block; }
  .thumb { margin-bottom:10px; border:2px solid transparent; border-radius:8px; overflow:hidden;
    cursor:pointer; background:#0b0d11; }
  .thumb.active { border-color:var(--accent); }
  .thumb svg { display:block; width:100%; height:auto; }
  .thumb:hover { border-color:#3a4456; }

  #main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  #drop { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    border:2px dashed var(--line); margin:16px; border-radius:14px; color:var(--muted);
    transition:.15s; text-align:center; padding:24px; }
  #drop.over { border-color:var(--accent); color:var(--fg); background:#161b22; }
  #drop b { color:var(--fg); font-size:18px; }
  .hint { font-size:13px; }
  #err { color:#ff6b6b; max-width:520px; }

  #stage { flex:1; display:none; align-items:center; justify-content:center; padding:16px; overflow:auto;
    min-width:0; min-height:0; position:relative; }
  #stage.show { display:flex; }
  /* 不要覆盖 Viewer 给 svg 设置的 width/height:100%。曾用 width:auto!important 覆盖，
     导致部分引擎（Safari 等）主窗口 svg 尺寸塌陷为 0，表现为「只有缩略图、主窗口空白」。 */
  #stage svg { display:block; }

  /* 媒体覆盖层：内嵌视频从 SVG 的 foreignObject 里搬到这里，
     用普通 HTML 绝对定位，按 foreignObject 的 CTM 精确对齐。
     （WebKit 不给 foreignObject 内 HTML 应用 SVG 缩放，会位置跑偏并盖住正文。）
     pointer-events:none 让空白处不挡翻页点击，只有视频本身可交互。 */
  #media-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
  #media-layer .media-overlay { position:absolute; display:block; background:#000;
    pointer-events:auto; object-fit:contain; border-radius:2px; }

  /* 内嵌音频：PPT 里往往只是个小喇叭图标，原生 <audio controls> 塞不进去，
     这里自绘一条紧凑控制条（播放键 + 进度 + 当前/总时长）。 */
  #media-layer .media-audio { position:absolute; display:flex; align-items:center; gap:7px;
    padding:0 10px; border-radius:999px; background:rgba(14,17,22,.88); color:#fff;
    border:1px solid rgba(255,255,255,.2); box-shadow:0 2px 10px rgba(0,0,0,.35);
    font-size:11px; line-height:1; cursor:pointer; pointer-events:auto;
    user-select:none; -webkit-user-select:none; }
  #media-layer .media-audio .ma-btn { all:unset; flex:0 0 auto; width:14px; text-align:center;
    font-size:11px; color:#fff; cursor:pointer; letter-spacing:-1px; }
  #media-layer .media-audio .ma-bar { flex:1 1 auto; min-width:20px; height:3px; border-radius:2px;
    background:rgba(255,255,255,.24); overflow:hidden; }
  #media-layer .media-audio .ma-bar i { display:block; height:100%; width:0; background:#8fb4ff;
    transition:width .12s linear; }
  #media-layer .media-audio .ma-time { flex:0 0 auto; min-width:52px; text-align:right;
    color:rgba(255,255,255,.82); font-variant-numeric:tabular-nums; font-size:10.5px; }
  #media-layer .media-audio.playing { border-color:rgba(79,140,255,.75); }
  #media-layer .media-audio.playing .ma-bar i { background:#4f8cff; }

  /* 待播动画提示：悬浮在画面底部，避免「整页空白以为坏了」。
     放在 #main 里而不是 #stage 里，避免和 Viewer 自己管理的图层节点混在一起。 */
  #animHint { position:absolute; left:50%; transform:translateX(-50%); bottom:76px; display:none;
    padding:9px 16px; border-radius:999px; background:rgba(20,24,31,.86); color:#fff; font-size:14px;
    border:1px solid rgba(255,255,255,.16); box-shadow:0 6px 22px rgba(0,0,0,.35);
    pointer-events:none; z-index:5; animation:pulse 1.8s ease-in-out infinite; }
  #animHint.show { display:block; }
  #animHint b { color:#8fb4ff; }
  @keyframes pulse { 0%,100% { opacity:.92 } 50% { opacity:.62 } }

  #toolbar { display:none; align-items:center; gap:8px; padding:9px 14px; background:var(--panel);
    border-top:1px solid var(--line); }  #toolbar.show { display:flex; }
  button { background:#262b34; color:var(--fg); border:1px solid #353b47; border-radius:8px;
    padding:7px 13px; font-size:14px; cursor:pointer; }
  button:hover { background:#2f3540; }
  #tbar.off { color:var(--muted); border-color:#2c313c; }
  /* 工具栏分组竖线：把「文件级」操作和「播放级」操作分开 */
  #toolbar .sep { flex:0 0 1px; width:1px; height:18px; background:var(--line); }
  /* 工具栏提示文字可能承载错误信息，限宽省略，避免撑破布局 */
  #anim { color:var(--muted); font-size:12px; max-width:42ch; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  #counter { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  #anim { color:var(--muted); font-size:13px; min-width:64px; }
</style>
</head>
<body>
<div id="app">
  <div id="thumbs"></div>
  <div id="main">
    <div id="drop">
      <b>拖入 .pptx / .ppt 文件，或点击选择</b>
      <div class="hint">本地渲染 · 不联网 · 不装 Office · 文件不出本机</div>
      <div id="err"></div>
    </div>
    <input id="file" type="file" accept=".pptx,.ppt" hidden />
    <div id="stage"></div>
    <div id="animHint"></div>
    <div id="toolbar">
      <button id="open" title="打开另一个 .pptx / .ppt 文件（快捷键 Ctrl+O）">打开文件</button>
      <span class="sep"></span>
      <button id="tbar" title="显示 / 隐藏左侧缩略图（快捷键 T）">缩略图：开</button>
      <button id="prev">← 上一页</button>
      <button id="next">下一页 →</button>
      <button id="zoomOut">－</button>
      <button id="zoomIn">＋</button>
      <button id="fs">全屏 (F)</button>
      <button id="tmode" title="切换文字渲染方式：自动 / HTML / 原生 SVG（文字不显示时可手动切换）">文字：自动</button>
      <button id="amode" title="整页：一进页面就显示全部内容（阅读用）；逐条：按 PPT 原样，单击才出现下一段（演讲用）">动画：整页</button>
      <span id="anim"></span>
      <span id="counter">—</span>
    </div>
  </div>
</div>
