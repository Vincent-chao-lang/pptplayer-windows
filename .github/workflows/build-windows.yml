name: build-windows

# 产出两件东西并上传到 GitHub Release：
#   1) NSIS 安装包 PPTPlayer_<ver>_x64-setup.exe —— 安装到 %LOCALAPPDATA%，带快捷方式与卸载项
#   2) 便携版 PPTPlayer.exe —— 免安装，双击即用
# 体积目标：两者都是个位数 MB。安装包不内嵌浏览器内核，复用系统 WebView2；LZMA 压缩。

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'web/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # Release 上传需要写权限；artifact 仅作备份（私有仓库配额可能已满，故允许失败）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 只为了拿到 tauri CLI（预编译二进制，几秒装完）；不引入任何前端依赖
      - name: Setup Node (for Tauri CLI only)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri --version

      # tauri build = cargo build --release + 按 tauri.conf.json 的 bundle.targets 打包
      # 首次会下载 NSIS（约 2 MB）到缓存，后续走 cargo/NSIS 缓存
      - name: Build app and NSIS installer
        run: tauri build

      - name: Verify outputs and report sizes
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/PPTPlayer.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem 'src-tauri/target/release' -ErrorAction SilentlyContinue | Select-Object Name, Length
            throw "未生成 $exe"
          }
          $setupItem = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $setupItem) {
            Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "未生成 NSIS 安装包"
          }

          $item = Get-Item $exe
          $exeMb   = [math]::Round($item.Length / 1MB, 2)
          $setupMb = [math]::Round($setupItem.Length / 1MB, 2)
          $exeSha  = (Get-FileHash $exe -Algorithm SHA256).Hash
          $setSha  = (Get-FileHash $setupItem.FullName -Algorithm SHA256).Hash

          Write-Host ("便携 exe   {0}  {1} MB  ({2} bytes)" -f $item.Name, $exeMb, $item.Length)
          Write-Host ("安装包     {0}  {1} MB  ({2} bytes)" -f $setupItem.Name, $setupMb, $setupItem.Length)
          Write-Host ("SHA256 exe    {0}" -f $exeSha)
          Write-Host ("SHA256 setup  {0}" -f $setSha)

          # 校验和文件随包上传，方便对方核对
          # 用 [IO.File]::WriteAllText 显式写 LF：Out-File 默认 CRLF，
          # 会让 macOS / Linux 的 `shasum -c` 把文件名带成 "xxx.exe\r" 而校验失败
          $sums = @(
            "$setSha  $($setupItem.Name)",
            "$exeSha  $($item.Name)"
          ) -join "`n"
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS.txt'),
            $sums + "`n",
            [Text.Encoding]::ASCII
          )

          @(
            "| 产物 | 体积 |",
            "|---|---|",
            "| 便携 exe | $exeMb MB |",
            "| 安装包 | $setupMb MB |",
            "",
            "| SHA256 | |",
            "|---|---|",
            "| exe | $exeSha |",
            "| setup | $setSha |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        # 私有仓库 artifact 配额仅 500MB，满了会让整个 job 失败；
        # 真正的取件口是下面的 Release 附件，这里失败不该阻断交付。
        continue-on-error: true
        with:
          name: PPTPlayer-windows-x64
          path: |
            src-tauri/target/release/PPTPlayer.exe
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 探测 release 是否存在会返回非零码，不能被当成脚本错误中断
          $ErrorActionPreference = 'Continue'

          $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $ver  = $conf.version
          $tag  = "v$ver"

          $exe   = 'src-tauri/target/release/PPTPlayer.exe'
          $setup = (Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1).FullName
          $exeMb   = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $setupMb = [math]::Round((Get-Item $setup).Length / 1MB, 2)

          # 单引号字符串：避免 PowerShell 把 $LOCALAPPDATA 之类的片段当变量展开
          $notes = @(
            'Windows 安装包 + 便携版。渲染引擎复用系统 WebView2，安装包不含浏览器内核，所以只有几 MB。',
            '',
            '## 装哪个',
            '',
            ('- **PPTPlayer_{0}_x64-setup.exe**（{1} MB）—— 推荐。当前用户安装，不弹 UAC；' -f $ver, $setupMb),
            '  装到 %LOCALAPPDATA%\PPTPlayer，进「设置 → 应用」可卸载。',
            '  开始菜单快捷方式自动创建；完成页有「创建桌面快捷方式」勾选项（默认已勾）。',
            ('- **PPTPlayer.exe**（{0} MB）—— 便携版，免安装，双击即用，适合放 U 盘。' -f $exeMb),
            '',
            '## 用法',
            '',
            '双击运行 → 把 .pptx 拖进窗口，或点左下角「打开文件」。',
            '←/→ 翻页，F 全屏，T 开关缩略图，Ctrl+O 换文件。',
            '',
            '## 注意',
            '',
            '- 依赖 WebView2 运行时：Win11 自带，Win10 绝大多数已有。安装包在缺失时会静默联网安装它（约 1-2 分钟）。',
            '- 便携版没有这一步 —— 若缺失会弹提示并给出下载地址。',
            '- 未做代码签名：安装包与 exe 首次运行都可能弹 SmartScreen，点「更多信息 → 仍要运行」。',
            '- 校验值见 SHA256SUMS.txt。'
          ) -join "`n"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "PPTPlayer $tag" --notes $notes
          } else {
            gh release edit $tag --notes $notes
          }
          gh release upload $tag $setup --clobber
          gh release upload $tag $exe --clobber
          gh release upload $tag SHA256SUMS.txt --clobber
          Write-Host "release: https://github.com/${{ github.repository }}/releases/tag/$tag"
